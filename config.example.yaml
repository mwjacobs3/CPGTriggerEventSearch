# ── Google News queries (by event type) ──────────────────────────────────────
google_news_queries:
  product_launch:
    # Food & Beverage
    - '"new food brand" launch US'
    - '"new beverage brand" launch US'
    - "emerging food startup launches US market"
    - "natural food brand launch US grocery"
    - "functional beverage brand launch"
    - "plant-based food brand launch US"
    - "snack brand launch US retail"
    - "artisan food brand launches US"
    - "specialty food brand launch"
    - "pet food brand launch US"
    - "new pet food brand US market"
    # Health, Beauty & Wellness
    - '"new supplement brand" launch US'
    - "health and wellness brand launch US"
    - "clean beauty brand launch US"
    - "personal care brand launch direct to consumer"
    - "skincare brand launch US DTC"
    - "haircare brand launch US retail"
    - "new wellness brand launch United States"
    - "OTC health brand launches US"
    # Home & Household
    - "home cleaning brand launch US"
    - "household goods brand launch DTC"
    - "eco-friendly home brand launch US"
    # DTC / General CPG
    - "challenger consumer brand launch US"
    - "DTC brand launch consumer goods"
    - "indie brand launch US CPG"
    - "founder-led brand launch US market"
    # Specialty / functional patterns (matches DOSS customer profile —
    # Magic Mind, Mezcla, Coaqua, Sauz, Spread The Love, Verve, Kahawa, Yough!)
    - "functional shot brand launch US"
    - "functional beverage brand launch DTC"
    - "specialty coffee brand launch US"
