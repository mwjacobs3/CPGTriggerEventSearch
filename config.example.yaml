# CPGTriggerEventSearch — configuration
# Copy this file to config.yaml before running.
# Secrets (Supabase keys, email credentials) stay in environment variables
# or GitHub Actions Secrets — never commit them here.

# ── Scraper settings ──────────────────────────────────────────────────────────
scraper:
  max_age_hours: 48                 # Drop events older than this. 0 = no age filter (use while seeding DB). 24/48/72 are sensible windows for ongoing runs.
  check_interval_minutes: 240       # Daemon mode only (GitHub Actions uses cron)
  request_delay: 1.5                # Seconds between HTTP requests
  timeout: 30
  user_agent: "Mozilla/5.0 (compatible; CPGTriggerEventSearch/2.0)"
  min_relevance_score: 50           # 0 = keep everything. Raise to 50–60 to send only strong leads downstream.

# ── Territory / ICP filters ───────────────────────────────────────────────────
# DOSS target: mid-market ($5M–$500M) US-based CPG companies.
territory:
  country: "United States"

  # Drop articles that are clearly about non-US companies
  excluded_locations:
    - "united kingdom"
    - " uk "
    - "australia"
    - " canada"
    - "india"
    - "germany"
    - "france"
    - "china"
    - "japan"
    - "mexico"
    - "brazil"
    - "europe"
    - "asia pacific"
    - "middle east"

  company_filters:
    exclude_public_companies: true

    # Size band — DOSS ICP is $5M–$500M revenue. We don't have revenue from
    # press releases, but total funding raised and employee count are decent
    # proxies. Leads inside this band get a relevance bonus; outside gets a
    # penalty. See `_relevance_score` in src/scrapers/base.py.
    size_band:
      funding_min_usd: 5000000        # $5M total raised
      funding_max_usd: 500000000      # $500M total raised
      employee_min: 10
      employee_max: 1000
      employee_hard_max: 2000         # > this gets a stronger penalty

    # Text patterns that indicate a publicly traded company
    public_company_indicators:
      - "nasdaq:"
      - "(nasdaq"
      - "nyse:"
      - "(nyse"
      - "otcbb:"
      - "s&p 500"
      - "fortune 500"
      - "fortune 100"

    # Mega CPG manufacturers — filtered if mentioned anywhere (too large for DOSS).
    excluded_public_companies:
      - "nestle"
      - "unilever"
      - "procter & gamble"
      - " p&g "
      - "colgate"
      - "l'oreal"
      - "loreal"
      - "johnson & johnson"
      - "kimberly-clark"
      - "general mills"
      - "kraft heinz"
      - "campbell soup"
      - "conagra"
      - "hershey"
      - "mondelez"
      - "pepsico"
      - "coca-cola"
      - "coca cola"
      - "mars inc"
      - "kellogg"
      - "kellanova"
      - "post holdings"
      - "treehouse foods"
      - "sysco"
      - "us foods"
      - "reckitt"
      - "church & dwight"
      - "clorox"
      - "anheuser-busch"
      - "ab inbev"
      - "molson coors"
      - "constellation brands"
      - "keurig dr pepper"
      - "tyson foods"
      - "hormel"
      - "estee lauder"
      - "coty inc"
      - "haleon"
      - "kenvue"

    # Major retailers / corporations — filtered ONLY when they are the
    # SUBJECT of the article. A mid-market CPG brand *entering* these
    # retailers (Meijer, Target, Whole Foods, Container Store, etc.) is
    # exactly the signal we want, so we don't want to blanket-exclude.
    excluded_mega_subjects:
      # Grocery / mass
      - "walmart"
      - "amazon"
      - "target corporation"
      - "kroger"
      - "costco"
      - "albertsons"
      - "dollar general"
