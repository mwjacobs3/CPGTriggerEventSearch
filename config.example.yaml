    - "smart device brand co-manufacturer"
    - "consumer hardware brand contract manufacturer"
    - "consumer electronics brand 3PL"

  # ── Apparel / soft goods ─────────────────────────────────────────────────────
  # Matches DOSS customers Little Beast, Tersus Solutions.
  apparel:
    - "DTC apparel brand launch US"
    - "kids apparel brand launch DTC"
    - "children's clothing brand launch US"
    - "pet apparel brand launch"
    - "performance apparel brand launch DTC"
    - "athleisure brand launch US"
    - "loungewear brand launch DTC"
    - "indie fashion brand launch US"
    - "swimwear brand launch DTC"
    - "footwear brand launch DTC"
