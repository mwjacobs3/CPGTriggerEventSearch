    - "new operations leader CPG brand hired"
    - "supply chain executive joins food beverage company"
    - "operations executive appointed consumer goods startup"
    - "logistics leader joins emerging CPG brand"

  # Supply-chain footprint queries — surface brands that name a 3PL,
  # co-manufacturer, or DOSS-integrated tool in their press. These are
  # the strongest "uses outsourced ops" signals we can mine from articles.
  supply_chain_footprint:
    # Named 3PLs (brand says "we use ShipBob / ShipMonk / Saddle Creek …")
    - '"works with ShipBob" CPG brand'
    - '"partnered with ShipBob" DTC brand'
    - '"using ShipMonk" consumer brand'
    - '"ShipHero" food beverage brand'
    - '"Flowspace" consumer brand fulfillment'
    - '"Stord" CPG brand'
    - '"Saddle Creek" consumer brand fulfillment'
    - '"Quiet Logistics" DTC brand'
    - '"Radial" consumer brand fulfillment'
    - '"NFI" CPG brand distribution'
    - '"Ryder" consumer brand fulfillment'
    # Generic 3PL phrasing
    - "DTC brand 3PL partner"
    - "CPG brand third-party logistics"
    - "consumer brand outgrew self-fulfillment"
    - "food beverage brand fulfillment partner"
    - "supplement brand 3PL"
    # Co-manufacturer / co-packer
    - '"co-manufacturer" food beverage brand'
    - '"co-packer" snack brand'
    - '"contract manufacturer" CPG brand'
    - '"contract packager" consumer brand'
    - '"co-manufacturing partner" emerging brand'
    - '"private label manufacturer" CPG'
    - "DTC brand co-packer"
    - "supplement brand contract manufacturer"
    - "beverage brand co-manufacturing"
    - "snack brand contract packager"
    # Named co-mans (rare in press, but high-signal when found)
    - '"Power Brands" beverage'
    - '"Nellson" supplement'
    - '"Pharmavite" supplement'
    - '"Refresco" beverage'
    - '"Niagara Bottling" beverage'

  # DOSS integration-stack queries — surface brands already running on
  # tools DOSS plugs into (Shopify, NetSuite, SPS Commerce, ShipBob, …).
  # A brand on a compatible stack short-circuits a major sales objection.
  integration_stack:
    # ERP / accounting
    - '"NetSuite" CPG brand'
    - '"NetSuite" food beverage brand'
    - '"Acumatica" consumer brand'
    - '"Sage Intacct" CPG brand'
    - '"QuickBooks" emerging CPG brand'
    - '"SAP Business One" food brand'
    - '"Microsoft Dynamics" consumer brand'
    # E-commerce
    - '"Shopify Plus" CPG brand'
    - '"powered by Shopify" food beverage brand'
    - '"BigCommerce" consumer brand'
    - '"Faire" emerging CPG brand'
    # WMS / 3PL platform
    - '"Cin7" CPG brand'
    - '"Extensiv" consumer brand'
    - '"Skubana" DTC brand'
    - '"Brightpearl" consumer brand'
    # EDI
    - '"SPS Commerce" CPG brand'
    - '"SPS Commerce" food beverage'
    - '"TrueCommerce" consumer brand'
    # Shipping
    - '"ShipStation" DTC brand'
    - '"Flexport" CPG brand'

  # Vertical-specific launch queries. The news scraper auto-classifies each
  # result against the keyword sets in `keywords:` above, so a "kids apparel
  # brand launches at Target" article still routes to product_launch /
  # retail_expansion correctly.

  # ── Consumer electronics / connected hardware ────────────────────────────────
  # Matches DOSS customers Eight Sleep, Echelon, Ozlo, Firstbase, Snow.
  consumer_electronics:
    - "sleep tech brand launch US"
    - "smart mattress brand launch"
    - "connected fitness brand launch US"
    - "smart home device brand launch DTC"
    - "wearable device startup launch US"
    - "smart earbuds brand launch US"
    - "consumer electronics brand DTC launch"
    - "connected hardware brand raises Series A"
    - "remote work hardware brand launch"
    - "home fitness equipment brand launch DTC"
