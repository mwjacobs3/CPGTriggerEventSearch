    - "apparel brand 3PL fulfillment partner"
    - "apparel brand contract manufacturer"
    - "recommerce brand raises funding"
    - "textile recycling brand raises"

  # ── Games / toys / hobbies ───────────────────────────────────────────────────
  # Matches DOSS customers Popdarts, Carrom, Sculpd.
  games_toys:
    - "tabletop game brand launch US"
    - "board game brand launch DTC"
    - "indie game studio launch consumer"
    - "party game brand launch US"
    - "outdoor lawn game brand launch"
    - "craft kit brand launch DTC"
    - "DIY kit brand launch US"
    - "hobby kit brand launch US"
    - "toy brand launch DTC US"
    - "consumer game brand raises seed"
    - "toy brand raises Series A"
    - "craft brand contract manufacturer"
