      - "whole foods"
      - "trader joe"
      - "sprouts farmers market"
      - "aldi"
      # Drug / convenience
      - "cvs"
      - "walgreens"
      - "rite aid"
      - "7-eleven"
      # Big-box / specialty
      - "home depot"
      - "lowe's"
      - "best buy"
      - "macy's"
      - "nordstrom"
      - "kohl's"
      - "tj maxx"
      - "marshalls"
      - "dick's sporting goods"
