  # ── Baby / kids / pediatric ──────────────────────────────────────────────────
  # Matches DOSS customer Dr. Noze Best (and adjacent to W-Wellness,
  # Tampon Tribe family/femcare).
  baby_kids:
    - "baby care brand launch DTC"
    - "pediatric health brand launch US"
    - "kids wellness brand launch US"
    - "children's health brand launch DTC"
    - "infant care brand launch US"
    - "newborn care brand launch DTC"
    - "baby brand raises Series A"
    - "baby brand raises seed round"
    - "kids nutrition brand launch"
    - "toddler brand launch DTC"
    - "maternity brand launch DTC"
    - "baby brand co-manufacturer"
    - "kids brand 3PL fulfillment"

  # ── Distribution / brand-management / 3PL platforms ──────────────────────────
  # The companies that BUILD the supply chain DOSS plugs into. Matches
  # DOSS customers Sourcify, Merrigo, Mersi Distribution, BRND Direct,
  # USA Supply Source, SPS Commerce.
  distribution_platforms:
    - "wholesale distribution platform raises"
    - "brand management platform raises funding"
    - "sourcing platform CPG raises"
    - "manufacturing platform CPG raises"
    - "reverse logistics platform raises"
    - "returns management platform raises"
    - "3PL platform raises funding"
    - "fulfillment platform raises Series A"
    - "supply chain platform CPG raises"
    - "co-manufacturing marketplace raises"
    - "private label platform raises"
    - "brand aggregator raises funding"
    - "wholesale platform CPG raises"
    - "B2B distribution platform launches"
    - "EDI platform CPG launches"

# ── Website-stack enrichment ──────────────────────────────────────────────────
# After dedup we fetch each lead's company website and inspect the homepage
# HTML for tech-stack tells (Shopify CDN, BigCommerce meta tag, Klaviyo,
# Yotpo, ShipStation, etc.). Any hit is merged into `tech_stack` and
# re-evaluated against DOSS_INTEGRATION_KEYWORDS so `integration_match`
# reflects the true stack rather than just press copy. Best-effort — any
# fetch failure is silent.
enrichment:
  enabled: true
  timeout_seconds: 6   # per-domain HTTP timeout

# ── Email alerts ──────────────────────────────────────────────────────────────
# Credentials are injected from environment variables at runtime.
# Set these in your .env or GitHub Actions Secrets.
alerts:
  email:
    enabled: true
    smtp_host: ""       # overridden by SMTP_HOST env var
    smtp_port: 587      # overridden by SMTP_PORT env var
    sender_email: ""    # overridden by EMAIL_SENDER env var
    sender_password: "" # overridden by EMAIL_PASSWORD env var
    recipient_emails: []# overridden by EMAIL_RECIPIENTS env var (comma-separated)
